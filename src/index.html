<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Discord Log Parser</title>
  </head>
  <body>
    <div class="app-shell">
      <!-- Header + theme toggle are rendered by Preact (ui/views/Header.jsx). -->
      <div id="app-header"></div>

      <!-- WIZARD STEPS -->
      <!-- Wizard steps rendered by Preact (ui/views/WizardSteps.jsx). -->
      <nav class="wizard-steps" id="wizardNav" aria-label="Progress"></nav>

      <!-- ═══════════════════════════════════════════════════════════════
       STEP 1: UPLOAD
       ═══════════════════════════════════════════════════════════════ -->
      <section class="panel active" id="panel1">
        <!-- Upload card (drop zone, file list, merge groups) rendered by Preact
             (ui/views/Upload.jsx), bound to the loadedFiles store signal. -->
        <div id="upload-files"></div>

        <!-- Parse summary rendered by Preact (ui/views/ParseSummary.jsx). -->
        <div id="parse-summary"></div>

        <div class="btn-row">
          <div></div>
          <div class="btn-row-right">
            <button class="btn btn-primary" id="toStep2" disabled>
              Continue
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <polyline points="9 18 15 12 9 6" />
              </svg>
            </button>
          </div>
        </div>
      </section>

      <!-- ═══════════════════════════════════════════════════════════════
       STEP 2: CONFIGURE
       ═══════════════════════════════════════════════════════════════ -->
      <section class="panel" id="panel2">
        <!-- "What are you making?" goal picker, rendered by Preact
             (ui/views/GoalPicker.jsx). Drives which settings below are shown. -->
        <div id="goal-picker"></div>

        <!-- Configure form rendered by Preact (ui/views/Configure.jsx), bound to
             the settings store. The user-filter list inside it is still
             populated/wired by app.js (migrates with the Upload step). -->
        <div id="configure-form"></div>

        <div class="btn-row">
          <button class="btn btn-secondary" id="backTo1">
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <polyline points="15 18 9 12 15 6" />
            </svg>
            Back
          </button>
          <div class="btn-row-right">
            <button class="btn btn-primary" id="toStep3">
              Preview &amp; Stats
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <polyline points="9 18 15 12 9 6" />
              </svg>
            </button>
          </div>
        </div>
      </section>

      <!-- ═══════════════════════════════════════════════════════════════
       STEP 3: PREVIEW & STATS
       ═══════════════════════════════════════════════════════════════ -->
      <section class="panel" id="panel3">
        <!-- Processing progress bar, rendered by Preact
             (ui/views/ProcessProgress.jsx) from the `processing` signal. -->
        <div id="process-progress"></div>

        <!-- Explore tab bar, rendered by Preact (ui/views/ExploreTabs.jsx);
             switches which card below is shown via panel3[data-explore-tab]. -->
        <div id="explore-tabs"></div>

        <!-- Analytics cards rendered by Preact (ui/views/Review/ReviewPanels.jsx):
             Summary + Technical are reactive; Insights/Wrapped/Calendar are static
             host skeletons driven imperatively by ui/analytics-host.js. The CSS
             data-explore-tab rules still reveal just the active one. -->
        <div id="review-panels"></div>

        <!-- Preview -->
        <div
          class="panel-card"
          id="previewCard"
          data-explore-panel="transcript"
          style="display: none"
        >
          <div class="card-title">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"
              />
              <polyline points="14 2 14 8 20 8" />
              <line x1="16" y1="13" x2="8" y2="13" />
              <line x1="16" y1="17" x2="8" y2="17" />
            </svg>
            Output Preview
          </div>
          <div class="preview-container">
            <div class="preview-toolbar">
              <span class="preview-info" id="previewInfo"></span>
              <div style="display: flex; gap: 8px; align-items: center">
                <select
                  id="previewGroup"
                  style="
                    display: none;
                    padding: 4px 8px;
                    font-size: 12px;
                    width: auto;
                  "
                  aria-label="Channel to preview"
                ></select>
                <button
                  class="btn btn-secondary"
                  style="padding: 5px 12px; font-size: 12px"
                  id="copyPreview"
                >
                  Copy all
                </button>
              </div>
            </div>
            <div class="preview-scroll" id="previewScroll">
              <pre id="previewContent"></pre>
            </div>
          </div>
        </div>

        <div class="btn-row">
          <button class="btn btn-secondary" id="backTo2">
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <polyline points="15 18 9 12 15 6" />
            </svg>
            Back
          </button>
          <div class="btn-row-right">
            <button class="btn btn-primary" id="toStep4" disabled>
              Export
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <polyline points="9 18 15 12 9 6" />
              </svg>
            </button>
          </div>
        </div>

        <!-- Processing status line, rendered by Preact
             (ui/views/ProcessProgress.jsx) from the `processing` signal. -->
        <div id="process-status"></div>
      </section>

      <!-- ═══════════════════════════════════════════════════════════════
       STEP 4: EXPORT
       ═══════════════════════════════════════════════════════════════ -->
      <section class="panel" id="panel4">
        <div class="panel-card">
          <div class="card-title">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
              <polyline points="7 10 12 15 17 10" />
              <line x1="12" y1="15" x2="12" y2="3" />
            </svg>
            Export Options
          </div>

          <!-- Complete-vs-trimmed confirmation rendered by Preact
               (ui/views/ExportSummary.jsx). -->
          <div id="export-summary"></div>

          <div class="form-group">
            <label class="form-label">Output format</label>
            <select id="outputFormat">
              <option value="txt">Compact TXT (LLM-optimized)</option>
              <option value="json">JSON (structured data)</option>
              <option value="md">Markdown</option>
              <option value="csv">CSV</option>
              <option value="html">HTML (readable transcript)</option>
            </select>
          </div>

          <label class="toggle-row">
            <input type="checkbox" id="chunkOutput" />
            <span class="toggle-switch"></span>
            <span>
              <span class="toggle-label">Split into chunks</span>
              <span class="toggle-desc"
                >For context windows smaller than your data</span
              >
            </span>
          </label>
          <div id="chunkOptions" style="display: none; margin: 8px 0 14px 48px">
            <div class="form-group">
              <label class="form-label"
                >Overlap (messages shared between chunks)</label
              >
              <input
                type="number"
                id="chunkOverlap"
                value="500"
                min="0"
                max="5000"
                class="inline-num"
                style="width: 100px !important"
              />
            </div>
          </div>

          <hr class="section-divider" />

          <div style="text-align: center; padding: 12px 0">
            <button
              class="btn btn-success"
              id="downloadBtn"
              style="font-size: 16px; padding: 14px 32px"
            >
              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                <polyline points="7 10 12 15 17 10" />
                <line x1="12" y1="15" x2="12" y2="3" />
              </svg>
              Download
            </button>
          </div>
        </div>

        <div class="btn-row">
          <button class="btn btn-secondary" id="backTo3">
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <polyline points="15 18 9 12 15 6" />
            </svg>
            Back
          </button>
        </div>

        <div
          class="status-bar"
          id="downloadStatus"
          role="status"
          aria-live="polite"
        ></div>
      </section>
    </div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
