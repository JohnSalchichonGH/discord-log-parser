name: Release

# Build both single-file outputs and attach them to a GitHub Release when a
# version tag (e.g. v1.0.0) is pushed.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build:all
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/index.html
            dist/index-accurate.html
          generate_release_notes: true
